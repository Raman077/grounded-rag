# Local stack for Phase 1. Postgres and Redis join in later phases (parents/feedback, caching).
#   docker compose -f deploy/docker-compose.yml up --build
name: grounded-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant:/qdrant/storage]

  jaeger:
    # Trace viewer at http://localhost:16686. Point OTEL_EXPORTER_OTLP_ENDPOINT at Langfuse instead to
    # get LLM-aware traces there.
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]

  query:
    build:
      context: ..
      dockerfile: services/query/Dockerfile
    depends_on: [qdrant, jaeger]
    ports: ["8000:8000"]
    env_file:
      - path: ../.env
        required: false
    environment:
      RAG_QDRANT_LOCATION: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # opencode serve running on the host (see README); ignored when RAG_LLM_PROVIDER=anthropic
      RAG_OPENCODE_URL: http://host.docker.internal:4096
    extra_hosts: ["host.docker.internal:host-gateway"]

  ingest:
    # One-off: docker compose -f deploy/docker-compose.yml run --rm ingest ingest /data --tenant nimbus --acl public
    build:
      context: ..
      dockerfile: services/query/Dockerfile
    profiles: ["tools"]
    depends_on: [qdrant]
    entrypoint: ["rag-ingest"]
    environment:
      RAG_QDRANT_LOCATION: http://qdrant:6333
    volumes: ["../eval/fixtures/corpus:/data:ro"]

volumes:
  qdrant:
