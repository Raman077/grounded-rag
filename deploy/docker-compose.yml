# Local development stack for Phase 1.
name: grounded-rag

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant:/qdrant/storage]

  redis:
    image: redis/redis-stack-server:latest
    ports: ["6379:6379"]

  langfuse:
    image: langfuse/langfuse:2
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret
      SALT: dev-salt
    ports: ["3000:3000"]

  # query:  added in Phase 1 (services/query)
  # ingest: added in Phase 1 (services/ingest)

volumes:
  pgdata:
  qdrant:
