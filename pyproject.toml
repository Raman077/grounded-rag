[project]
name = "grounded-rag"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation platform"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["services/query", "services/ingest", "libs/core"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "libs"]
