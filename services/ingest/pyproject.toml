[project]
name = "ingest-service"
version = "0.1.0"
description = "Ingestion pipeline: parse, chunk, embed and index documents into Qdrant"
requires-python = ">=3.12"
dependencies = [
  "rag-core[fastembed]",
  "trafilatura>=1.12",
  "pypdf>=5",
]

[project.optional-dependencies]
# Layout-aware PDF parsing (tables, OCR). Large install: pulls in torch.
docling = ["docling>=2"]

[project.scripts]
rag-ingest = "ingest_service.cli:main"

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_service"]
