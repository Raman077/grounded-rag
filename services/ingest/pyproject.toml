[project]
name = "ingest-service"
version = "0.1.0"
description = "Temporal ingestion workflows: connectors, parsing, chunking, enrichment, embedding"
requires-python = ">=3.12"
dependencies = [
  "rag-core",
  "temporalio>=1.7",
  "docling>=2",
  "trafilatura>=1.12",
  "qdrant-client>=1.11",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
]

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_service"]
