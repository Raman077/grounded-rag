[project]
name = "query-service"
version = "0.1.0"
description = "FastAPI query service: retrieve, pack context, generate with citations, stream over SSE"
requires-python = ">=3.12"
dependencies = [
  "rag-core[fastembed]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.60",
  "pyjwt>=2.9",
  "pyyaml>=6",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.scripts]
rag-devtoken = "query_service.devtoken:main"

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_service"]
