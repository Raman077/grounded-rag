[project]
name = "query-service"
version = "0.1.0"
description = "FastAPI query service: guard, understand, retrieve, rerank, pack, generate"
requires-python = ">=3.12"
dependencies = [
  "rag-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic",
  "qdrant-client>=1.11",
  "redis>=5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
]

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_service"]
